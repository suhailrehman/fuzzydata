[pytest]
# log_cli is intentionally off: fuzzydata logs a line per operation, which buries test
# results in noise. Enable ad hoc with `pytest -o log_cli=true --log-cli-level=INFO`.
log_file = pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format=%Y-%m-%d %H:%M:%S

