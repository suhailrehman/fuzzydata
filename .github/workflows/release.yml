name: publish

on:
  release:
    types: [published]
  # Manual trigger, used for the TestPyPI dry run before a real release.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only publish on an actual release; workflow_dispatch stops after build so the
    # artifact can be inspected or pushed to TestPyPI by hand.
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      # PyPI Trusted Publishing (OIDC). Must be configured on the PyPI project first;
      # once working, delete the legacy PYPI_TOKEN secret.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
