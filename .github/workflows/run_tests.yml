name: tests

on:
  # Restricted to main: pull_request already covers feature branches, so this avoids
  # running the whole suite twice for every pushed commit on a PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Floor + newest. The floor leg catches syntax/typing that newer versions accept
        # (e.g. `str | None` annotations, which are a runtime error on 3.9).
        python-version: ['3.9', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # requirements.txt deliberately excludes modin[all], which would install both dask
      # and ray. The modin client is deprecated and excluded from the suite.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: pytest -q --cov=fuzzydata --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.9'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
